<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Birds Eye Main Configuration Icon</title>
  <desc id="desc">A top-down bird's-eye view icon showing the starting carrom piece configuration on a simple board-like surface with a background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f141a"/>
      <stop offset="100%" stop-color="#1a232c"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a5a38"/>
      <stop offset="100%" stop-color="#5e381f"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1ddb0"/>
      <stop offset="100%" stop-color="#e4c78a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#69e0d1" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#69e0d1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pieceLight" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff9ea"/>
      <stop offset="100%" stop-color="#dcc38d"/>
    </radialGradient>
    <radialGradient id="pieceDark" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#6b625d"/>
      <stop offset="100%" stop-color="#272323"/>
    </radialGradient>
    <radialGradient id="queen" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff9aa2"/>
      <stop offset="100%" stop-color="#b01631"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.26"/>
    </filter>
    <filter id="coinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="320" fill="url(#glow)"/>

  <!-- simple top-down board-like base -->
  <g filter="url(#shadow)">
    <rect x="164" y="164" width="696" height="696" rx="64" fill="url(#frame)"/>
    <rect x="222" y="222" width="580" height="580" rx="42" fill="url(#surface)"/>
  </g>

  <!-- subtle center ring to seat the configuration -->
  <circle cx="512" cy="512" r="175" fill="none" stroke="#8f6540" stroke-width="8" opacity="0.65"/>
  <circle cx="512" cy="512" r="92" fill="none" stroke="#8f6540" stroke-width="6" opacity="0.38"/>

  <!-- bird's-eye starting configuration -->
  <g transform="translate(512 512)" filter="url(#coinShadow)">
    <!-- outer 12 -->
    <circle cx="0" cy="-132" r="34" fill="url(#pieceDark)"/>
    <circle cx="66" cy="-114" r="34" fill="url(#pieceLight)"/>
    <circle cx="114" cy="-66" r="34" fill="url(#pieceDark)"/>
    <circle cx="132" cy="0" r="34" fill="url(#pieceLight)"/>
    <circle cx="114" cy="66" r="34" fill="url(#pieceDark)"/>
    <circle cx="66" cy="114" r="34" fill="url(#pieceLight)"/>
    <circle cx="0" cy="132" r="34" fill="url(#pieceDark)"/>
    <circle cx="-66" cy="114" r="34" fill="url(#pieceLight)"/>
    <circle cx="-114" cy="66" r="34" fill="url(#pieceDark)"/>
    <circle cx="-132" cy="0" r="34" fill="url(#pieceLight)"/>
    <circle cx="-114" cy="-66" r="34" fill="url(#pieceDark)"/>
    <circle cx="-66" cy="-114" r="34" fill="url(#pieceLight)"/>

    <!-- inner 6 -->
    <circle cx="0" cy="-64" r="34" fill="url(#pieceLight)"/>
    <circle cx="55" cy="-32" r="34" fill="url(#pieceDark)"/>
    <circle cx="55" cy="32" r="34" fill="url(#pieceLight)"/>
    <circle cx="0" cy="64" r="34" fill="url(#pieceDark)"/>
    <circle cx="-55" cy="32" r="34" fill="url(#pieceLight)"/>
    <circle cx="-55" cy="-32" r="34" fill="url(#pieceDark)"/>

    <!-- queen -->
    <circle cx="0" cy="0" r="36" fill="url(#queen)" stroke="#ffe3ad" stroke-width="5"/>

    <!-- highlights -->
    <g fill="#ffffff" opacity="0.22">
      <circle cx="-10" cy="-10" r="8"/>
      <circle cx="53" cy="-117" r="7"/>
      <circle cx="-78" cy="96" r="7"/>
    </g>
  </g>
</svg>
